name: Repair and validate simulator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair draw function and validate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'index.html';
          let s = fs.readFileSync(p, 'utf8');
          const start = s.indexOf('function draw(');
          const end = s.indexOf('function buildAcademicReport', start);
          if (start < 0 || end < 0) throw new Error('No se encontró el bloque draw');
          const replacement = `function draw(p,cf,sc){
            const c=$('flowChart'),ctx=c.getContext('2d'); c.width=c.clientWidth*2; c.height=c.clientHeight*2; ctx.scale(2,2);
            let W=c.clientWidth,H=c.clientHeight,max=Math.max(1,...cf.map(x=>Math.abs(x)));
            ctx.strokeStyle='#999';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
            cf.forEach((v,i)=>{const x=(i+.5)*W/cf.length,y=H/2-v/max*(H*.4);ctx.strokeStyle=v>=0?'#166534':'#b91c1c';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x,H/2);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#334155';ctx.font='11px Arial';ctx.fillText('A'+i,x-8,H-8);});
            const d=$('scenChart'),dc=d.getContext('2d');d.width=d.clientWidth*2;d.height=d.clientHeight*2;dc.scale(2,2);W=d.clientWidth;H=d.clientHeight;
            const mx=Math.max(1,...sc.map(x=>Math.abs(x.van)));sc.forEach((x,i)=>{const px=(i+.5)*W/3,y=H/2-x.van/mx*(H*.4);dc.strokeStyle=x.van>=0?'#166534':'#b91c1c';dc.lineWidth=24;dc.beginPath();dc.moveTo(px,H/2);dc.lineTo(px,y);dc.stroke();dc.fillStyle='#334155';dc.font='11px Arial';dc.fillText(x.label,px-28,H-8);});
            const q=$('candleChart'),qc=q.getContext('2d');q.width=q.clientWidth*2;q.height=q.clientHeight*2;qc.scale(2,2);W=q.clientWidth;H=q.clientHeight;
            const vals=sc.map(x=>x.van),mn=Math.min(...vals),mx2=Math.max(...vals),range=Math.max(1,mx2-mn),Y=v=>H-25-(v-mn)/range*(H-50);
            sc.forEach((x,i)=>{const px=(i+.5)*W/3,open=x.cf[0],close=x.van,hi=Math.max(open,close,...x.cf.slice(1)),lo=Math.min(open,close,...x.cf.slice(1));qc.strokeStyle='#334155';qc.lineWidth=2;qc.beginPath();qc.moveTo(px,Y(lo));qc.lineTo(px,Y(hi));qc.stroke();qc.lineWidth=18;qc.strokeStyle=close>=open?'#166534':'#b91c1c';qc.beginPath();qc.moveTo(px,Y(open));qc.lineTo(px,Y(close));qc.stroke();qc.fillStyle='#334155';qc.font='11px Arial';qc.fillText(x.label,px-28,H-8);});
          }
          `;
          s = s.slice(0,start) + replacement + s.slice(end);
          fs.writeFileSync(p,s);
          NODE
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d') 2>/dev/null || true
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'),js=s.match(/<script>([\\s\\S]*?)<\\/script>/)[1];fs.writeFileSync('/tmp/index.js',js)"
          node --check /tmp/index.js
      - name: Commit repaired file
        run: |
          if git diff --quiet -- index.html; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair chart rendering and validate simulator"
          git push
